    chip.style.setProperty('--c',S.c);chip.style.setProperty('--c2',S.c2);chip.querySelector('span').textContent=mmss(left)}

  ftEl.querySelectorAll('.fc-dots i').forEach((d,i)=>d.classList.toggle('on',i<FT.round%4||(FT.round>0&&FT.round%4===0&&FT.mode!=='focus'&&i<4)));

  if(pre.s&&!pre.tid){FT.s=pre.s}

    FT.s=nx?nx.s:(['sft','et','ict'].includes(dk)?dk:'sft');if(nx)FT.tid=nx.id}

        <circle class="fb" cx="100" cy="100" r="92" stroke-width="9"/><circle class="ff" cx="100" cy="100" r="92" stroke-width="9" stroke-dasharray="578.05" stroke-dashoffset="578.05"/></svg>

      <div class="fc-set">${['sft','et','ict','dip','hex','asg'].map(k=>`<button class="chp sm" data-fs="${k}" aria-pressed="false" style="--c:${SUBJ[k].c};--c2:${SUBJ[k].c2}">${SUBJ[k].n}</button>`).join('')}</div>

function scoreAgg(){const m={};state.scores.forEach(r=>{const k=r.s+'|'+r.u;m[k]=m[k]||{s:r.s,u:r.u,c:0,n:0};m[k].c+=r.c;m[k].n+=r.n});

function sparkSVG(vals){if(vals.length<2)return '';const W=300,H=92,pad=8,xs=i=>pad+i*(W-2*pad)/(vals.length-1),ys=v=>H-pad-(v/100)*(H-2*pad);

/* ---------- calendar export ---------- */
function icsText(){
  const fold=l=>{const enc=new TextEncoder();if(enc.encode(l).length<=73)return l;let out='',cur='',bytes=0;
    for(const ch of l){const b=enc.encode(ch).length;if(bytes+b>73){out+=cur+'\r\n ';cur='';bytes=1}cur+=ch;bytes+=b}return out+cur};
  const esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const today=todayISO(),wk=weekStart(clampDay(today)),we=isoAdd(wk,6);
  const list=ALL.filter(t=>t.ap&&t.e&&t.k!=='rest').filter(t=>ICS.range==='week'?(t.date>=wk&&t.date<=we):ICS.range==='rest'?t.date>=today:true).filter(t=>!(ICS.hideDone&&state.done[t.id]));
  const dt=(d,m)=>d.replace(/-/g,'')+'T'+String(Math.floor(m/60)%24).padStart(2,'0')+String(m%60).padStart(2,'0')+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nima Schedule//SI//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Nima Schedule','X-WR-TIMEZONE:Asia/Colombo',
    'BEGIN:VTIMEZONE','TZID:Asia/Colombo','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0530','TZOFFSETTO:+0530','TZNAME:+0530','END:STANDARD','END:VTIMEZONE'];
  list.forEach(t=>{const a=startMin(t),b=endMin(t);const S=SUBJ[t.s];
    L.push('BEGIN:VEVENT','UID:'+t.id+'@nima-schedule','DTSTAMP:'+stamp,'DTSTART;TZID=Asia/Colombo:'+dt(t.date,a),'DTEND;TZID=Asia/Colombo:'+dt(t.date,Math.min(b,1439)),
      'SUMMARY:'+esc2('['+S.n+'] '+t.ti),'DESCRIPTION:'+esc2([t.d,state.notes[t.id]?'Notes: '+state.notes[t.id]:''].filter(Boolean).join('\n')),'CATEGORIES:'+esc2(S.n),
      'BEGIN:VALARM','TRIGGER:-PT'+state.settings.lead+'M','ACTION:DISPLAY','DESCRIPTION:'+esc2(t.ti),'END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return {text:L.map(fold).join('\r\n')+'\r\n',n:list.length}}
function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

let deferred=null;const ib=document.getElementById('install');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)ib.hidden=false});
ib.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;ib.hidden=true});
addEventListener('appinstalled',()=>{ib.hidden=true});
(function(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);let seen=false;try{seen=localStorage.getItem('nima-ios-hint')==='1'}catch(e){}
  if(ios&&!standalone&&!seen){setTimeout(()=>{const d=document.createElement('div');d.className='ioshint';
    d.innerHTML='<div><b>Phone එකට install කරන්න</b>Safari එකේ Share button එක ඔබලා "Add to Home Screen" තෝරන්න.</div><button aria-label="වහන්න">×</button>';
    d.querySelector('button').onclick=()=>{d.remove();try{localStorage.setItem('nima-ios-hint','1')}catch(e){}};document.body.appendChild(d)},3200)}})();
})();
</script>
</body>
</html>
