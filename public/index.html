<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nima Schedule</title>
<meta name="description" content="ඔක් 12 සිට නොවැ 30 වෙනකන් A/L, Diploma සහ Hexora වැඩ balance කරන plan එක.">
<meta name="theme-color" content="#0A0C1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nima Schedule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&text=NimaSchedule&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: app shell — dark curved-tab sidebar (desktop) / bump bottom-nav (phone), glow task cards coloured by subject, three skins */
:root{
  --bg:#EDEFF7; --surface:#FFFFFF; --surface-2:#E6E9F3; --line:#D8DCEA; --fg:#141836; --muted:#5C6383;
  --accent:#4F5BFF; --accent2:#8B5CF6;
  --side:#141838; --side-fg:#C7CBEA; --side-mute:#7D84AF; --side-hover:rgb(255 255 255 / .07);
  --neo-bg:#E4E7F0; --neo-dark:rgb(163 170 196 / .75); --neo-light:rgb(255 255 255 / .95); --neo-hole:#B9BFD3;
  --shadow:0 14px 34px -18px rgb(20 24 60 / .35);
  --sft:#D97706; --sft2:#F97316; --et:#0D9488; --et2:#06B6D4; --ict:#2563EB; --ict2:#6366F1;
  --dip:#DB2777; --dip2:#F43F5E; --hex:#7C3AED; --hex2:#A855F7; --asg:#EA580C; --asg2:#EF4444;
  --rev:#64748B; --rev2:#94A3B8; --mix:#4F5BFF; --mix2:#8B5CF6;
  --ok:#16A34A; --ok2:#22C55E; --warn:#DC2626;
  --f-display:"Bricolage Grotesque","Noto Sans Sinhala",system-ui,sans-serif;
  --f-body:"Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.175,.885,.32,1.275); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#161A2E; --surface-2:#1D2240; --line:#272D4D; --fg:#E9EBF7; --muted:#9AA1C3;
  --accent:#8C96FF; --accent2:#C084FC;
  --side:#070914; --side-fg:#C7CBEA; --side-mute:#6F76A0; --side-hover:rgb(255 255 255 / .06);
  --neo-bg:#1A1E33; --neo-dark:rgb(0 0 0 / .6); --neo-light:rgb(255 255 255 / .06); --neo-hole:#0B0D18;
  --shadow:0 18px 40px -20px rgb(0 0 0 / .8);
  --sft:#FBBF24; --sft2:#FB923C; --et:#2DD4BF; --et2:#22D3EE; --ict:#60A5FA; --ict2:#818CF8;
  --dip:#F472B6; --dip2:#FB7185; --hex:#A78BFA; --hex2:#C084FC; --asg:#FB923C; --asg2:#F87171;
  --rev:#94A3B8; --rev2:#CBD5E1; --mix:#8C96FF; --mix2:#C084FC; --ok:#22C55E; --ok2:#4ADE80; --warn:#F87171;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2E; --surface-2:#1D2240; --line:#272D4D; --fg:#E9EBF7; --muted:#9AA1C3;
  --accent:#8C96FF; --accent2:#C084FC;
  --side:#070914; --side-fg:#C7CBEA; --side-mute:#6F76A0; --side-hover:rgb(255 255 255 / .06);
  --neo-bg:#1A1E33; --neo-dark:rgb(0 0 0 / .6); --neo-light:rgb(255 255 255 / .06); --neo-hole:#0B0D18;
  --shadow:0 18px 40px -20px rgb(0 0 0 / .8);
  --sft:#FBBF24; --sft2:#FB923C; --et:#2DD4BF; --et2:#22D3EE; --ict:#60A5FA; --ict2:#818CF8;
  --dip:#F472B6; --dip2:#FB7185; --hex:#A78BFA; --hex2:#C084FC; --asg:#FB923C; --asg2:#F87171;
  --rev:#94A3B8; --rev2:#CBD5E1; --mix:#8C96FF; --mix2:#C084FC; --ok:#22C55E; --ok2:#4ADE80; --warn:#F87171;
  color-scheme:dark;
}
/* the page's own skin switch (Light / Dark / Black) wins over the host theme */
:root[data-skin="light"]{
  --bg:#EDEFF7; --surface:#FFFFFF; --surface-2:#E6E9F3; --line:#D8DCEA; --fg:#141836; --muted:#5C6383;
  --accent:#4F5BFF; --accent2:#8B5CF6;
  --side:#141838; --side-fg:#C7CBEA; --side-mute:#7D84AF; --side-hover:rgb(255 255 255 / .07);
  --neo-bg:#E4E7F0; --neo-dark:rgb(163 170 196 / .75); --neo-light:rgb(255 255 255 / .95); --neo-hole:#B9BFD3;
  --shadow:0 14px 34px -18px rgb(20 24 60 / .35);
  --sft:#D97706; --sft2:#F97316; --et:#0D9488; --et2:#06B6D4; --ict:#2563EB; --ict2:#6366F1;
  --dip:#DB2777; --dip2:#F43F5E; --hex:#7C3AED; --hex2:#A855F7; --asg:#EA580C; --asg2:#EF4444;
  --rev:#64748B; --rev2:#94A3B8; --mix:#4F5BFF; --mix2:#8B5CF6; --ok:#16A34A; --ok2:#22C55E; --warn:#DC2626;
  color-scheme:light;
}
:root[data-skin="dark"],:root[data-skin="black"]{
  --bg:#0E1120; --surface:#161A2E; --surface-2:#1D2240; --line:#272D4D; --fg:#E9EBF7; --muted:#9AA1C3;
  --accent:#8C96FF; --accent2:#C084FC;
  --side:#070914; --side-fg:#C7CBEA; --side-mute:#6F76A0; --side-hover:rgb(255 255 255 / .06);
  --neo-bg:#1A1E33; --neo-dark:rgb(0 0 0 / .6); --neo-light:rgb(255 255 255 / .06); --neo-hole:#0B0D18;
  --shadow:0 18px 40px -20px rgb(0 0 0 / .8);
  --sft:#FBBF24; --sft2:#FB923C; --et:#2DD4BF; --et2:#22D3EE; --ict:#60A5FA; --ict2:#818CF8;
  --dip:#F472B6; --dip2:#FB7185; --hex:#A78BFA; --hex2:#C084FC; --asg:#FB923C; --asg2:#F87171;
  --rev:#94A3B8; --rev2:#CBD5E1; --mix:#8C96FF; --mix2:#C084FC; --ok:#22C55E; --ok2:#4ADE80; --warn:#F87171;
  color-scheme:dark;
}
:root[data-skin="black"]{
  --bg:#000000; --surface:#0B0B11; --surface-2:#15151D; --line:#22222C; --muted:#8E8EA6;
  --side:#111118; --neo-bg:#101016; --neo-hole:#000;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;color:#fff;overflow:hidden;cursor:pointer;
  background:radial-gradient(60% 45% at 50% 42%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%),radial-gradient(40% 35% at 70% 70%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 70%),#0A0C1C;
  animation:spOut .75s 2.25s var(--ease) forwards}
.splash.skip{animation:spOut .45s var(--ease) forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.08);visibility:hidden;pointer-events:none}}
.sp-in{display:grid;justify-items:center;gap:14px;text-align:center;padding:0 16px}
.sp-ring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.sp-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgb(255 255 255 / .12);border-top-color:var(--accent2);animation:spin 1.4s linear infinite, fadeIn .4s both}
.sp-ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 65%);animation:breathe 2.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes breathe{50%{transform:scale(1.15);opacity:.6}}
.sp-logo{position:relative;z-index:1;width:92px;height:92px;filter:drop-shadow(0 14px 28px rgb(0 0 0 / .45));animation:logoPop .9s var(--spring) both}
@keyframes logoPop{from{opacity:0;transform:scale(.2) rotate(-35deg)}to{opacity:1;transform:none}}
.sp-logo .lg-cal{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .9s .35s var(--ease) forwards}
.sp-logo .lg-chk{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s 1.05s var(--ease) forwards}
.sp-logo .lg-dot{transform-origin:48px 48px;animation:dotIn .5s 1.2s var(--spring) both, orbit 3s 1.7s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}}
@keyframes orbit{to{transform:rotate(360deg)}}
.sp-name{margin:6px 0 0;font-family:"Bricolage Grotesque",var(--f-display);font-weight:800;font-size:clamp(38px,9vw,64px);line-height:1;letter-spacing:-.02em;perspective:600px;white-space:nowrap}
.sp-name span{display:inline-block;animation:letter .7s var(--spring) both;animation-delay:calc(.6s + var(--i) * 55ms)}
.sp-name .g{background:linear-gradient(100deg,#C7CBFF,var(--accent2) 60%,#F9A8D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-name .sp{width:.28em}
@keyframes letter{from{opacity:0;transform:translateY(46px) rotateX(-85deg) scale(.8);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sp-tag{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#AEB4DA;animation:rise .6s 1.45s var(--ease) both}
.sp-bar{width:150px;height:3px;border-radius:3px;background:rgb(255 255 255 / .1);overflow:hidden;animation:fadeIn .4s 1.5s both}
.sp-bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),#F9A8D4);transform-origin:left;animation:fill 1.2s 1.1s var(--ease) both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sp-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:rgb(255 255 255 / .4);animation:fadeIn .6s 1.6s both}
.mark.logo{background:none;box-shadow:none;padding:0}
.mark.logo svg{width:100%;height:100%;filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--accent) 45%,transparent))}
.brand .mark.logo{transition:transform .6s var(--spring)}
.brand:hover .mark.logo{transform:rotate(-8deg) scale(1.06)}
.brand .lg-dot,.top .lg-dot{transform-origin:48px 48px;animation:orbit 6s linear infinite}

/* ---------- shell ---------- */
.app{--sw:252px;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .55s var(--ease)}
.app[data-collapsed="true"]{--sw:88px}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:22px 0 18px 16px;z-index:30;transition:background-color .4s}
.brand{display:flex;align-items:center;gap:12px;padding:0 16px 0 6px;margin-bottom:28px;min-height:44px;white-space:nowrap}
.brand .fade{overflow:hidden;min-width:0}
.mark{width:42px;height:42px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.brand b{display:block;font-family:var(--f-display);font-size:19px;color:#fff;line-height:1.1}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--side-mute);letter-spacing:.06em}
.fade{transition:opacity .3s,transform .4s var(--ease)}
.app[data-collapsed="true"] .fade{opacity:0;transform:translateX(-8px);pointer-events:none}
.collapse{position:absolute;right:-17px;top:26px;width:34px;height:34px;border-radius:50%;background:var(--side);border:2px solid var(--bg);color:var(--side-fg);display:grid;place-items:center;
  box-shadow:0 6px 16px -6px rgb(0 0 0 / .5);transition:transform .5s var(--spring),background-color .4s}
.collapse:hover{transform:scale(1.08)}
.app[data-collapsed="true"] .collapse svg{transform:rotate(180deg)}
.collapse svg{transition:transform .5s var(--spring)}

.snav{position:relative;display:grid;gap:6px}
.sind{position:absolute;left:0;right:0;top:0;height:54px;background:var(--bg);border-radius:27px 0 0 27px;
  transform:translateY(calc(var(--n,0) * 60px));transition:transform .6s var(--spring),background-color .4s;z-index:0;pointer-events:none}
.sind::before,.sind::after{content:"";position:absolute;right:0;width:27px;height:27px;background:transparent;pointer-events:none}
.sind::before{top:-27px;border-bottom-right-radius:27px;box-shadow:9px 9px 0 9px var(--bg)}
.sind::after{bottom:-27px;border-top-right-radius:27px;box-shadow:9px -9px 0 9px var(--bg)}
.sind::before,.sind::after{transition:box-shadow .4s}
.snav button{position:relative;z-index:1;height:54px;display:flex;align-items:center;gap:16px;padding:0 18px 0 16px;border-radius:27px 0 0 27px;white-space:nowrap;overflow:hidden;
  color:var(--side-fg);font-weight:600;font-size:15px;transition:color .35s}
.snav button .ic{width:24px;height:24px;flex:0 0 auto;transition:transform .5s var(--spring)}
.snav button:not([aria-current="true"]):hover{background:var(--side-hover);margin-right:16px;border-radius:16px}
.snav button:not([aria-current="true"]):hover .ic{transform:scale(1.12) rotate(-6deg)}
.snav button[aria-current="true"]{color:var(--fg)}
.snav button[aria-current="true"] .ic{color:var(--accent);transform:scale(1.08)}
.sfoot{margin-top:auto;padding-right:16px;display:grid;gap:14px}
.daysleft{background:var(--side-hover);border-radius:16px;padding:12px 14px;white-space:nowrap;overflow:hidden}
.daysleft b{font-family:var(--f-display);font-size:26px;color:#fff;line-height:1}
.daysleft span{display:block;font-size:12px;color:var(--side-mute)}
.app[data-collapsed="true"] .daysleft{padding:12px 0;text-align:center}
.app[data-collapsed="true"] .daysleft span{display:none}

/* skin segmented */
.skins{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgb(255 255 255 / .06);border-radius:13px;padding:4px}
.skins .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:rgb(255 255 255 / .12);
  transform:translateX(calc(var(--n,0) * 100%));transition:transform .55s var(--spring)}
.skins button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 2px;font-size:12px;color:var(--side-mute);font-weight:600;white-space:nowrap}
.skins button svg{width:14px;height:14px}
.skins button[aria-pressed="true"]{color:#fff}
.app[data-collapsed="true"] .side .skins{grid-template-columns:1fr;gap:2px}
.app[data-collapsed="true"] .side .skins .pill{width:calc(100% - 8px);height:calc((100% - 8px)/3);bottom:auto;transform:translateY(calc(var(--n,0) * 100%))}
.app[data-collapsed="true"] .side .skins button span{display:none}

/* ---------- main ---------- */
.main{min-width:0;padding-inline:clamp(16px,3.4vw,40px);padding-block:18px 60px}
.inner{max-width:960px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top .mmark{display:none}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,32px);line-height:1.15;letter-spacing:-.01em}
.top p{margin:0;font-size:13px;color:var(--muted)}
.top .tt{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}

/* neumorphic dark-mode switch */
.neo{position:relative;width:76px;height:40px;border-radius:22px;background:var(--neo-bg);flex:0 0 auto;
  box-shadow:inset 4px 4px 9px var(--neo-dark),inset -4px -4px 9px var(--neo-light);transition:background-color .4s,box-shadow .4s}
.neo .hole{position:absolute;top:50%;right:13px;width:18px;height:8px;margin-top:-4px;border-radius:50%;background:var(--neo-hole);
  box-shadow:inset 1px 2px 3px rgb(0 0 0 / .45);transition:right .6s var(--spring),left .6s var(--spring)}
.neo .knob{position:absolute;top:5px;left:5px;width:30px;height:30px;border-radius:50%;background:var(--neo-bg);display:grid;place-items:center;
  box-shadow:4px 4px 10px var(--neo-dark),-3px -3px 8px var(--neo-light);transition:transform .6s var(--spring),background-color .4s}
.neo .knob svg{position:absolute;width:17px;height:17px;transition:opacity .35s,transform .6s var(--spring)}
.neo .sun{color:#F59E0B;filter:drop-shadow(0 0 5px rgb(245 158 11 / .7))}
.neo .moon{color:#38BDF8;filter:drop-shadow(0 0 6px rgb(56 189 248 / .9));opacity:0;transform:rotate(-90deg) scale(.4)}
.neo[aria-checked="true"] .knob{transform:translateX(36px)}
.neo[aria-checked="true"] .sun{opacity:0;transform:rotate(90deg) scale(.4)}
.neo[aria-checked="true"] .moon{opacity:1;transform:none}
.neo[aria-checked="true"] .hole{right:auto;left:13px}

#view{animation:viewIn .45s var(--ease) both}
#view.in-r{animation:inR .5s var(--ease) both}#view.in-l{animation:inL .5s var(--ease) both}
#dayBody.in-r{animation:inR .5s var(--ease) both}#dayBody.in-l{animation:inL .5s var(--ease) both}
.strip.in-r{animation:inR .45s var(--ease) both}.strip.in-l{animation:inL .45s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translate3d(42px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-42px,0,0)}to{opacity:1;transform:none}}
.swap{animation:swap .5s var(--ease) both}
@keyframes swap{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
button,.sd,.nb{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}
.wday,.bcard{content-visibility:auto;contain-intrinsic-size:auto 420px}
.wday header{cursor:pointer}
.bitem .when{cursor:pointer}
.bnav .bi.bounce{animation:bounce .7s var(--spring)}
@keyframes bounce{0%{transform:translateY(0) scale(.7)}55%{transform:translateY(-22px) scale(1.12)}100%{transform:translateY(-18px) scale(1)}}
.dh-title{animation:swap .6s .05s var(--ease) both}
.swipe-hint{display:none;text-align:center;font-size:11.5px;color:var(--muted);margin:-6px 0 10px}
@media (hover:none){.swipe-hint{display:block}}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag{animation:rise .5s var(--ease) both;animation-delay:min(calc(var(--i,0) * 35ms),380ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- home: strip ---------- */
.strip{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.strip .ind{position:absolute;top:0;bottom:0;left:0;width:calc((100% - 36px)/7);border-radius:16px;
  background:linear-gradient(160deg,var(--c),var(--c2));box-shadow:0 10px 22px -10px var(--c);
  transform:translateX(calc(var(--n,0) * (100% + 6px)));transition:transform .6s var(--spring),background .4s}
.sd{position:relative;z-index:1;overflow:hidden;border-radius:16px;padding:9px 2px 10px;display:grid;justify-items:center;gap:3px;min-width:0;
  background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);transition:color .3s,border-color .3s,transform .4s var(--spring)}
.sd:hover:not(:disabled){transform:translateY(-2px)}
.sd small{font-size:11px;color:var(--muted);transition:color .3s}
.sd b{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sd .dot{width:6px;height:6px;border-radius:50%;background:var(--dc)}
.sd .pr{width:62%;height:3px;border-radius:3px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}
.sd .pr i{display:block;height:100%;background:var(--ok);transition:width .5s var(--ease)}
.sd[aria-current="true"]{color:#fff;border-color:transparent;background:transparent}
.sd[aria-current="true"] small{color:rgb(255 255 255 / .85)}
.sd[aria-current="true"] .dot{background:#fff}
.sd[aria-current="true"] .pr{background:rgb(255 255 255 / .3)}
.sd[aria-current="true"] .pr i{background:#fff}
.sd.is-today:not([aria-current="true"]) small{color:var(--accent);font-weight:700}
.sd:disabled{opacity:.3;cursor:default}

/* ---------- home: day hero ---------- */
.dhero{position:relative;overflow:hidden;border-radius:24px;padding:20px 22px 22px;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));
  background:
    radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 55%),
    radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--c2) 20%,transparent),transparent 60%),
    var(--surface);box-shadow:var(--shadow)}
.dhero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c2) 35%,transparent),transparent 65%);animation:float 7s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translate(-18px,-12px) scale(1.08)}}
.dh-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dh-nav{display:flex;gap:6px}
.nb{position:relative;overflow:hidden;height:36px;min-width:36px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600;
  background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);transition:transform .4s var(--spring),border-color .3s}
.nb:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.nb:disabled{opacity:.35;cursor:default}
.dh-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-top:10px;position:relative;z-index:1}
.dh-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--c),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.dh-sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
.dh-sub b{color:var(--fg);font-family:var(--f-mono)}
.dh-next{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);font-size:13.5px;min-width:0}
.dh-next .lbl{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--c);white-space:nowrap}
.dh-next span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* rings */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:color-mix(in srgb,var(--fg) 10%,transparent)}
.ring .rf{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring .rv{position:absolute;font-family:var(--f-mono);font-weight:700}
.ring.big{width:104px;height:104px}.ring.big svg{width:104px;height:104px}.ring.big .rv{font-size:20px}
.ring.sm{width:38px;height:38px}.ring.sm svg{width:38px;height:38px}.ring.sm .rv{font-size:10px}

/* ---------- task cards ---------- */
.tl{display:grid;gap:10px}
.tk{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 44px;gap:14px;align-items:start;padding:14px 14px 16px;border-radius:18px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));overflow:hidden;
  transition:transform .45s var(--spring),box-shadow .4s,border-color .3s,opacity .4s}
.tk::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--c),var(--c2))}
.tk .glow{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:color-mix(in srgb,var(--fg) 6%,transparent);overflow:hidden}
.tk .glow i{display:block;height:100%;width:28%;background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 12px var(--c);transition:width .8s var(--ease)}
.tk:hover{transform:translateY(-3px);box-shadow:0 18px 34px -20px color-mix(in srgb,var(--c) 70%,transparent);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c),var(--c2));
  box-shadow:0 8px 20px -8px var(--c),inset 0 1px 0 rgb(255 255 255 / .35);transition:transform .5s var(--spring)}
.ico svg{width:22px;height:22px}
.tk:hover .ico{transform:rotate(-8deg) scale(1.06)}
.r1{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tm{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.tm small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:11px;margin-left:3px}
.pill{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:1px 8px;border-radius:7px}
.kind{font-size:11.5px;color:var(--muted);font-weight:600}
.kind.old{color:var(--warn)}
.live-b{font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--c),var(--c2));padding:1px 8px;border-radius:7px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
.tk h4{margin:0;font-size:15.5px;font-weight:600;line-height:1.45}
.tk h4 span{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.6px;transition:background-size .5s var(--ease),color .3s}
.tk p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
.tk.done{opacity:.72}
.tk.done h4 span{background-size:100% 1.6px;color:var(--muted)}
.tk.done .glow i{width:100%;background:linear-gradient(90deg,var(--ok),var(--ok2));box-shadow:0 0 12px var(--ok)}
.tk.live{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 18px 40px -22px var(--c)}
.tk.live .ico{animation:liveRing 2s infinite}
@keyframes liveRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}80%,100%{box-shadow:0 0 0 12px transparent}}
.tk.fixed{background:color-mix(in srgb,var(--c) 7%,var(--surface));border-style:dashed}
.tk.fixed .chk{visibility:hidden}
.tk.fixed .glow{display:none}
.rest{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;padding:2px 6px}
.rest::before,.rest::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.rest svg{width:15px;height:15px}
.rest .mono{font-size:11.5px}

/* check button + burst */
.chk{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .45s var(--spring)}
.chk:hover{transform:scale(1.08)}
.chk:active{transform:scale(.9)}
.chk .cs{width:42px;height:42px}
.chk .cb{fill:none;stroke:var(--line);stroke-width:2.5;transition:stroke .3s}
.chk .cf{fill:var(--ok);transform-origin:21px 21px;transform:scale(0);transition:transform .45s var(--spring)}
.chk .cm{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s .12s var(--ease)}
.done .chk .cf,.chk[aria-pressed="true"] .cf{transform:scale(1)}
.done .chk .cb{stroke:var(--ok)}
.done .chk .cm{stroke-dashoffset:0}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--bc,var(--ok));opacity:0}
.pop .burst i{animation:burst .7s var(--ease) forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-30px) scale(.2)}}
.pop{animation:popCard .5s var(--spring)}
@keyframes popCard{40%{transform:scale(1.015)}}

/* ---------- generic cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--f-display);font-size:18px;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-size:20px;margin:26px 0 12px}
.note{font-size:13px;color:var(--muted)}

/* progress tab */
.phero{position:relative;overflow:hidden;border-radius:24px;padding:22px;background:var(--side);color:#F3F4FF;display:grid;gap:16px;box-shadow:var(--shadow)}
.phero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:radial-gradient(40% 60% at 92% 8%,color-mix(in srgb,var(--hex) 55%,transparent),transparent 70%),radial-gradient(35% 55% at 70% 0%,color-mix(in srgb,var(--dip) 40%,transparent),transparent 70%),radial-gradient(40% 50% at 100% 70%,color-mix(in srgb,var(--ict) 45%,transparent),transparent 70%);
  animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-24px,10px,0) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
.phero h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.4vw,36px);line-height:1.15;text-wrap:balance;position:relative}
.phero h2 em{font-style:normal;background:linear-gradient(90deg,var(--sft),var(--dip));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.stat{background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .1);border-radius:16px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#AEB4DA}
.sbar{height:5px;border-radius:9px;background:rgb(255 255 255 / .12);overflow:hidden;margin-top:9px}
.sbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#fff,#C7CBFF);transition:width 1s var(--ease)}
.dls{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.dls::-webkit-scrollbar{display:none}
.dl{position:relative;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;transition:transform .4s var(--spring)}
.dl:hover{transform:translateY(-2px)}
.dl .n{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(140deg,var(--c),var(--c2));box-shadow:0 8px 18px -8px var(--c);font-variant-numeric:tabular-nums}
.dl .t{font-size:13px;line-height:1.35;font-weight:600}
.dl .t small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.dl.past{opacity:.5}
.missed{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--surface));border-radius:20px;margin-top:16px}
.missed summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:600}
.missed summary::-webkit-details-marker{display:none}
.missed summary .n{min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;background:linear-gradient(140deg,var(--warn),#F97316)}
.missed summary small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.missed .chev{margin-left:auto;transition:transform .4s var(--spring)}
.missed[open] .chev{transform:rotate(180deg)}
.missed .tl{padding:0 12px 14px}
.bgrid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{position:relative;overflow:hidden}
.bcard::after{content:"";position:absolute;right:-50px;top:-50px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.bhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bhead .ico{width:42px;height:42px;border-radius:13px}
.bhead h3{margin:0;font-size:17px}
.bhead small{display:block;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.bhead .ring{margin-left:auto}
.gbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c),var(--c2));transition:width 1s var(--ease)}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px;margin:4px 0 12px}
.meter .gbar{grid-column:1/-1;height:6px;margin-bottom:6px}
.bitem{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--surface-2);font-size:13.5px;line-height:1.45}
.bitem .chk,.mini .chk{width:30px;height:30px}
.bitem .chk .cs,.mini .chk .cs{width:30px;height:30px}
.bitem .bt span{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.4px;transition:background-size .5s var(--ease)}
.bitem.done .bt span{background-size:100% 1.4px;color:var(--muted)}
.bitem .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.bitem .when.late{color:var(--warn);font-weight:700}

/* week */
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wkhead .tt{flex:1;min-width:0}
.wkhead h2{margin:0;font-family:var(--f-display);font-size:22px}
.wkhead p{margin:0;font-size:13px;color:var(--muted)}
.weekgrid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0;transition:transform .45s var(--spring),box-shadow .4s}
.wday:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.wday header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--surface)),color-mix(in srgb,var(--c2) 8%,var(--surface)))}
.wday header b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.25}
.wday header small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.wday header .ring{margin-left:auto}
.wday.is-today{box-shadow:0 0 0 2px var(--accent)}
.wday .open{font-size:12px;font-weight:600;color:var(--c);padding:8px 14px 12px;display:block}
.mini{display:grid;grid-template-columns:42px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--surface-2)}
.mini .tmn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mini .tx{font-size:13px;line-height:1.4;min-width:0}
.mini .tx i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(var(--c),var(--c2));margin-right:7px;vertical-align:1px}
.mini .tx span{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.4px;transition:background-size .5s var(--ease)}
.mini.done .tx span{background-size:100% 1.4px;color:var(--muted)}
.mini.fixed .tx{color:var(--muted)}
.mini.fixed .chk{visibility:hidden}

/* rules */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card ol,.card ul{margin:0;padding-left:20px;display:grid;gap:9px;font-size:14px}
.card li b{font-weight:600}
.card li span{color:var(--muted);display:block;font-size:13px}
.dep{display:grid;gap:8px}
.dep div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:13px;background:var(--surface-2);border-radius:12px;padding:9px 11px}
.dep div i{font-style:normal;color:var(--accent);font-family:var(--f-mono);font-weight:700}
.dep div small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.hours{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:84px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px}
.hrow .gbar{height:10px}
.hrow .hv{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.frame{overflow-x:auto}
.frame table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.frame th,.frame td{text-align:left;padding:8px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.frame th{font-weight:600;white-space:nowrap}
.frame td span{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 13%,transparent)}
.frame td span b{font-family:var(--f-mono);font-size:11px;color:var(--c);margin-right:4px}
.skincard .skins{background:var(--surface-2);max-width:360px}
.skincard .skins .pill{background:var(--surface);box-shadow:0 2px 8px -2px rgb(0 0 0 / .2)}
.skincard .skins button{color:var(--muted);font-size:13px;padding:9px 4px}
.skincard .skins button[aria-pressed="true"]{color:var(--fg)}

/* ---------- bottom nav (phone) ---------- */
.bnav,.bfade{display:none}
@media (max-width:860px){
  .app,.app[data-collapsed="true"]{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-inline:16px;padding-block:0 calc(130px + env(safe-area-inset-bottom,0px))}
  .top{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-bottom:10px;
    transition:background-color .35s,box-shadow .35s,padding .35s var(--ease)}
  .top::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;opacity:0;transition:opacity .35s;
    background:linear-gradient(var(--bg),transparent)}
  .top .mark.logo svg{filter:none}
  .top.scrolled{background:color-mix(in srgb,var(--bg) 93%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 1px 0 color-mix(in srgb,var(--line) 70%,transparent);padding-bottom:8px}
  .top.scrolled::after{opacity:1}
  .top h1{transition:font-size .35s var(--ease)}
  .top.scrolled h1{font-size:21px}
  .top p{transition:opacity .3s,max-height .35s var(--ease);max-height:22px;overflow:hidden}
  .top.scrolled p{opacity:0;max-height:0}
  .top .mmark{display:grid;width:38px;height:38px;border-radius:12px;font-size:17px}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:68px;position:fixed;z-index:40;left:0;right:0;bottom:0;
    height:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--side);border-radius:26px 26px 0 0;box-shadow:0 -12px 32px -14px rgb(0 0 0 / .5);transition:background-color .4s,transform .45s var(--ease)}
  .bfade{display:block;position:fixed;left:0;right:0;z-index:35;pointer-events:none;bottom:calc(68px + env(safe-area-inset-bottom,0px));height:120px;
    background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),color-mix(in srgb,var(--bg) 55%,transparent) 45%,var(--bg) 96%);
    transition:opacity .4s;opacity:1}
  .bfade.atend{opacity:0}
  .bump{position:absolute;top:-17px;left:0;width:25%;height:20px;transform:translateX(calc(var(--n,0) * 100%));transition:transform .6s var(--spring);pointer-events:none}
  .bump svg{width:100%;height:100%;overflow:visible}
  .bump .bf{fill:var(--side);transition:fill .4s}
  .bump .bl{fill:none;stroke:url(#bumpGrad);stroke-width:2.2;filter:drop-shadow(0 -2px 6px color-mix(in srgb,var(--accent) 70%,transparent))}
  .bnav button{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--side-mute);font-size:11px;font-weight:600}
  .bnav .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .6s var(--spring),background .4s,box-shadow .4s}
  .bnav .bi svg{width:22px;height:22px}
  .bnav button span{transition:opacity .3s,transform .5s var(--spring)}

  .bnav button[aria-current="true"] span{transform:translateY(-14px)}

}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .tk{grid-template-columns:40px minmax(0,1fr) 40px;gap:11px;padding:12px 10px 14px 12px}

  .dh-main .ring{position:absolute;right:0;top:-6px}

}
.rv-wait{opacity:0;transform:translateY(28px) scale(.97);animation:none!important}
.rv-in{animation:reveal .65s var(--ease) both!important}
@keyframes reveal{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.rv-wait{opacity:1;transform:none}.splash{display:none}*,*::before,*::after{animation:none!important;transition:none!important}}
/* ================= v2: sheets, forms, tools, charts ================= */
:root{--r-card:20px}
.bnav{grid-template-columns:repeat(5,1fr)}
@media (max-width:860px){.bnav{grid-template-columns:repeat(5,1fr)}.bump{width:20%}.bnav button span{font-size:10.5px}}

/* ---------- toast (shared) ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:260;transform:translate(-50%,-160%);max-width:min(92vw,440px);width:max-content;
  background:var(--side);color:#fff;border-radius:16px;padding:12px 14px 12px 16px;font-size:13.5px;line-height:1.45;box-shadow:0 18px 40px -12px rgb(0 0 0 / .55);
  display:flex;gap:10px;align-items:center;transition:transform .55s var(--spring);border:1px solid rgb(255 255 255 / .08)}
.toast.show{transform:translate(-50%,0)}
.toast b{display:block}
.toast .ic{font-size:18px;line-height:1.2;align-self:flex-start}
.toast .tx{display:block;color:#C7CBEA}
.toast .undo{margin-left:6px;padding:7px 12px;border-radius:10px;font-weight:700;font-size:12.5px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));white-space:nowrap}
.toast .tbar{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:rgb(255 255 255 / .18);overflow:hidden}
.toast .tbar i{display:block;height:100%;background:#fff;transform-origin:left;animation:tbar var(--tt,4.2s) linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}

/* ---------- sheet ---------- */
.sh-bd{position:fixed;inset:0;z-index:180;background:rgb(6 8 22 / .55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s;display:flex;align-items:flex-end;justify-content:center}
.sh-bd.in{opacity:1}
.sheet{position:relative;width:min(560px,100%);max-height:min(92dvh,92vh);display:flex;flex-direction:column;background:var(--surface);color:var(--fg);
  border-radius:28px 28px 0 0;box-shadow:0 -24px 60px -20px rgb(0 0 0 / .55);border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .6s var(--spring);will-change:transform;
  padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.sh-bd.in .sheet{transform:none}
.sh-bd.out{opacity:0}.sh-bd.out .sheet{transform:translateY(105%);transition:transform .35s var(--ease)}
.sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:140px;pointer-events:none;
  background:radial-gradient(70% 100% at 10% 0%,color-mix(in srgb,var(--c,var(--accent)) 24%,transparent),transparent 70%),radial-gradient(60% 90% at 100% 0%,color-mix(in srgb,var(--c2,var(--accent2)) 18%,transparent),transparent 70%)}
.sh-handle{position:relative;width:42px;height:5px;border-radius:5px;background:color-mix(in srgb,var(--fg) 20%,transparent);margin:10px auto 2px;flex:0 0 auto;touch-action:none}
.sh-head{position:relative;display:flex;align-items:center;gap:12px;padding:10px 18px 6px;flex:0 0 auto}
.sh-head h3{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.25;flex:1;min-width:0;text-wrap:balance}
.sh-x{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);transition:transform .4s var(--spring)}
.sh-x:hover{transform:rotate(90deg)}
.sh-x svg{width:16px;height:16px}
.sh-body{position:relative;overflow:auto;overscroll-behavior:contain;padding:8px 18px 14px;display:grid;gap:14px;-webkit-overflow-scrolling:touch}
.sh-foot{position:relative;display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--surface-2);background:color-mix(in srgb,var(--surface) 92%,transparent);flex:0 0 auto}
.sh-body>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--k,0) * 40ms + 120ms)}
@media (min-width:700px){.sh-bd{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line);transform:translateY(40px) scale(.95);opacity:0;transition:transform .55s var(--spring),opacity .3s}
  .sh-bd.in .sheet{opacity:1}.sh-bd.out .sheet{transform:translateY(24px) scale(.96);opacity:0}.sh-handle{display:none}.sh-head{padding-top:18px}}
.sh-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- form bits ---------- */
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.inp,.txa,.sel{width:100%;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;
  transition:border-color .25s,background .25s,box-shadow .3s;appearance:none;-webkit-appearance:none}
.txa{min-height:84px;resize:vertical;line-height:1.55}
.inp:focus,.txa:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--surface)}
input[type=time].inp,input[type=date].inp{font-family:var(--f-mono);min-height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chp{position:relative;overflow:hidden;padding:8px 13px;border-radius:12px;font-size:13px;font-weight:600;background:var(--surface-2);border:1.5px solid transparent;color:var(--fg);
  transition:transform .4s var(--spring),background .3s,color .3s,border-color .3s,box-shadow .3s}
.chp:hover{transform:translateY(-2px)}
.chp:active{transform:scale(.94)}
.chp[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--c,var(--accent)),var(--c2,var(--accent2)));box-shadow:0 8px 18px -8px var(--c,var(--accent))}
.chp.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:15px;font-weight:700;font-size:14.5px;
  background:var(--surface-2);color:var(--fg);transition:transform .4s var(--spring),box-shadow .3s,filter .3s,opacity .3s}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.btn.pri{color:#fff;background:linear-gradient(135deg,var(--c,var(--accent)),var(--c2,var(--accent2)));box-shadow:0 12px 24px -12px var(--c,var(--accent))}
.btn.dng{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface-2))}
.btn.ok{color:#fff;background:linear-gradient(135deg,var(--ok),var(--ok2));box-shadow:0 12px 24px -12px var(--ok)}
.btn.grow{flex:1}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.warn-t{color:var(--warn)}
.sheet .tpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.quick{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:2px 18px}
.quick::-webkit-scrollbar{display:none}
.quick .chp{flex:0 0 auto}

/* toggle switch */
.tgl{position:relative;flex:0 0 auto;width:50px;height:30px;border-radius:30px;background:var(--surface-2);border:1.5px solid var(--line);transition:background .35s,border-color .35s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .3);transition:transform .5s var(--spring)}
.tgl[aria-checked="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.tgl[aria-checked="true"]::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--surface-2)}
.setrow:first-of-type{border-top:0}
.setrow>div{flex:1;min-width:0}
.setrow b{display:block;font-size:14px;font-weight:600}
.setrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.setrow.dis{opacity:.5;pointer-events:none}

/* segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--cols,3),1fr);background:var(--surface-2);border-radius:14px;padding:4px}
.seg .sp{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--cols,3));border-radius:11px;background:var(--surface);box-shadow:0 2px 8px -2px rgb(0 0 0 / .25);
  transform:translateX(calc(var(--n,0) * 100%));transition:transform .55s var(--spring)}
.seg button{position:relative;z-index:1;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted);transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--fg)}

/* ---------- task card extras ---------- */
.tk{cursor:pointer}
.tk .chk{position:relative;z-index:2}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,var(--surface-2));color:var(--fg);animation:rise .4s var(--spring) both}
.bdg svg{width:12px;height:12px}
.bdg.mv{color:var(--accent)}.bdg.cu{color:var(--hex)}.bdg.clash{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface-2))}
.bdg.nt{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--muted)}
.tk.flyout{animation:flyout .55s var(--ease) forwards!important;animation-delay:calc(var(--k,0) * 60ms)!important;pointer-events:none}
@keyframes flyout{to{opacity:0;transform:translateX(70px) scale(.94);filter:blur(3px)}}
.tk.arrive{animation:arrive .7s var(--spring) both}
@keyframes arrive{from{opacity:0;transform:translateX(-30px) scale(.95)}to{opacity:1;transform:none}}
.mini .tx .nt{color:var(--muted);font-size:11px}

/* day actions + fab */
.dact{display:flex;gap:8px;margin:-6px 0 16px;flex-wrap:wrap}
.dact .btn{min-height:42px;font-size:13.5px;flex:1 1 auto;border:1px solid var(--line);background:var(--surface)}
.dact .btn.skip{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:20px;display:none;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 16px 30px -10px var(--accent);transition:transform .5s var(--spring),opacity .3s;animation:fabIn .7s .6s var(--spring) both}
.fab svg{width:26px;height:26px;transition:transform .5s var(--spring)}
.fab:hover svg{transform:rotate(90deg)}
.fab:active{transform:scale(.9)}
.fab.show{display:grid}
@keyframes fabIn{from{opacity:0;transform:scale(.3) rotate(-90deg)}}
@media (min-width:861px){.fab{bottom:28px;right:32px}}

/* teacher questions on a class day */
.qcard{border-radius:20px;padding:14px 16px;margin-bottom:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.qcard h4{margin:0 0 8px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.qcard h4 svg{width:18px;height:18px;color:var(--c)}
.qrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--c) 12%,var(--surface-2));font-size:13.5px;line-height:1.5}
.qrow:first-of-type{border-top:0}
.qrow>span{flex:1;min-width:0;overflow-wrap:anywhere}
.qrow.done>span{text-decoration:line-through;color:var(--muted)}
.qk{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:2px solid var(--line);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .4s var(--spring)}
.qk svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.3);transition:opacity .25s,transform .4s var(--spring)}
.qrow.done .qk{background:var(--ok);border-color:var(--ok)}.qrow.done .qk svg{opacity:1;transform:none}
.qk:active{transform:scale(.85)}
.qx{color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:8px;flex:0 0 auto}
.qx:hover{color:var(--warn)}.qx svg{width:14px;height:14px}

/* ---------- focus chip + overlay ---------- */
.fchip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border-radius:13px;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--c,var(--accent)),var(--c2,var(--accent2)));box-shadow:0 8px 18px -8px var(--c,var(--accent));animation:rise .5s var(--spring) both}
.fchip[hidden]{display:none}
.fchip svg{width:16px;height:16px;animation:tick 2s linear infinite}
.fchip.paused svg{animation:none}
@keyframes tick{to{transform:rotate(360deg)}}
.focus{position:fixed;inset:0;z-index:190;display:grid;place-items:center;color:#fff;overflow:auto;opacity:0;transform:scale(1.04);transition:opacity .45s,transform .6s var(--ease);
  background:radial-gradient(70% 55% at 50% 38%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%),radial-gradient(50% 40% at 80% 85%,color-mix(in srgb,var(--c2) 26%,transparent),transparent 70%),#080A18}
.focus.in{opacity:1;transform:none}
.focus.out{opacity:0;transform:scale(.97)}
.fc-in{display:grid;justify-items:center;gap:14px;text-align:center;padding:64px 20px 28px;width:min(440px,100%);margin:auto}
.fc-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}
.fc-top .sh-x{background:rgb(255 255 255 / .1);color:#fff}
.fc-subj{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C7CBEA}
.fc-task{font-size:15px;color:#E9EBF7;max-width:34ch;text-wrap:balance;min-height:1.5em}
.fring{position:relative;width:min(280px,70vw,36dvh);aspect-ratio:1;display:grid;place-items:center}
.fring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.fring .fb{fill:none;stroke:rgb(255 255 255 / .1)}
.fring .ff{fill:none;stroke:url(#fg);stroke-linecap:round;filter:drop-shadow(0 0 10px var(--c));transition:stroke-dashoffset .9s linear}
.fring::after{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 66%);z-index:-1;animation:breathe 4s ease-in-out infinite}
.focus.paused .fring::after{animation:none;opacity:.4}
.fring .tm2{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,17vw,76px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fring small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:#AEB4DA;margin-top:6px;text-transform:uppercase}
.fc-ctl{display:flex;gap:14px;align-items:center}
.fc-ctl .rb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255 / .1);color:#fff;transition:transform .45s var(--spring),background .3s}
.fc-ctl .rb:active{transform:scale(.88)}.fc-ctl .rb svg{width:22px;height:22px}
.fc-ctl .go{width:84px;height:84px;background:linear-gradient(140deg,var(--c),var(--c2));box-shadow:0 18px 36px -10px var(--c)}
.fc-ctl .go svg{width:32px;height:32px}
.fc-modes{display:flex;gap:8px}
.fc-modes .chp{background:rgb(255 255 255 / .08);color:#C7CBEA}
.fc-modes .chp[aria-pressed="true"]{color:#fff}
.fc-set{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.fc-set .chp{background:rgb(255 255 255 / .08);color:#C7CBEA}
.fc-set .chp[aria-pressed="true"]{color:#fff}
.fc-today{font-size:12.5px;color:#AEB4DA}
.fc-dots{display:flex;gap:6px}
.fc-dots i{width:9px;height:9px;border-radius:50%;background:rgb(255 255 255 / .18);transition:background .4s,transform .5s var(--spring)}
.fc-dots i.on{background:var(--c);transform:scale(1.2);box-shadow:0 0 10px var(--c)}

/* ---------- tools tab ---------- */
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));align-items:start}
.tcard{position:relative;overflow:hidden}
.tcard .th{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tcard .th .ico{width:40px;height:40px;border-radius:13px}
.tcard .th .ico svg{width:19px;height:19px}
.tcard .th h3{margin:0;font-size:17px}
.tcard .th small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.tcard .th .btn{margin-left:auto}
.tcard::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--accent)) 20%,transparent),transparent 70%);pointer-events:none}
.tcard>*{position:relative;z-index:1}
.tcard.wide{grid-column:1/-1}

.fbig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.fbig .ring.big{width:96px;height:96px}.fbig .ring.big svg{width:96px;height:96px}
.fbig .ring.big .rv{font-size:17px}
.fbig p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.fbig p b{color:var(--fg);font-family:var(--f-mono)}

.cd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.cd .num{font-family:var(--f-display);font-weight:800;font-size:60px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,var(--accent),var(--accent2),var(--dip));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd .lbl{font-size:13px;color:var(--muted)}
.cd .lbl b{display:block;color:var(--fg);font-size:15px}
.cdbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.cdbar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--dip));transition:width 1.2s var(--ease)}

/* charts */
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;margin:6px 0 4px;position:relative}
.chart::before{content:"";position:absolute;left:0;right:0;bottom:calc(21px + (100% - 21px) * .6);border-top:1.5px dashed color-mix(in srgb,var(--ok) 45%,transparent);pointer-events:none}
.col{display:grid;grid-template-rows:1fr auto;gap:5px;height:100%;min-width:0;justify-items:center}
.col .bar{align-self:end;width:min(34px,78%);border-radius:10px 10px 4px 4px;min-height:5px;height:0;background:linear-gradient(180deg,var(--c,var(--accent)),var(--c2,var(--accent2)));transition:height .9s var(--ease);transition-delay:calc(var(--i,0) * 70ms);position:relative}
.col .bar.top::after{content:attr(data-v);position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.col small{font-size:11px;color:var(--muted);font-weight:600}
.col.now small{color:var(--accent);font-weight:800}
.col.ok .bar{--c:var(--ok);--c2:var(--ok2)}

function dayKey(d){return d===START?['පරණ වැඩ ඉවර කරන දවස','ict']:DAYTYPE[dow(d)]}

/* ---------- time helpers (12-hour pieces <-> minutes) ---------- */
const endMin=t=>{let a=mins(t.t,t.ap),b=mins(t.e,t.ap2||t.ap);if(b<=a)b+=720;return b};
const startMin=t=>mins(t.t,t.ap);
function toPieces(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am',h12=h%12===0?12:h%12;
  return {t:h12+':'+String(mm).padStart(2,'0'),ap}}
/* "HH:MM" 24h -> {t,ap} */
function from24(v){const [h,m]=v.split(':').map(Number);return toPieces(h*60+m)}
function to24(t,ap){const m=mins(t,ap);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function setSpan(o,a,b){const p=toPieces(a),q=toPieces(b);o.t=p.t;o.ap=p.ap;o.e=q.t;o.ap2=q.ap===p.ap?'':q.ap;return o}

/* ---------- merged plan: base plan + the person's own changes ----------
   st.edits[id] = {ti,d,date,t,e,ap,ap2}   changed title / day / time of a plan task
   st.hidden[id] = 1                       a plan task the person removed
   st.custom = [{id,date,s,ti,d,t,e,ap,ap2,k}]   tasks the person added                          */
function makePlan(st){
  st=st||{};const ed=st.edits||{},hid=st.hidden||{},cu=st.custom||[];
  const P={};ORDER.forEach(d=>{P[d]={iso:d,w:BASE[d].w,wk:BASE[d].wk,tasks:[]}});
  const put=t=>{if(P[t.date])P[t.date].tasks.push(t)};
  ORDER.forEach(d=>BASE[d].tasks.forEach(b=>{
    if(hid[b.id])return;
    const t=Object.assign({},b,{home:d}),e=ed[b.id];
    if(e){for(const k of ['ti','d','date','t','e','ap','ap2'])if(e[k]!==undefined)t[k]=e[k];
      if((e.date&&e.date!==d)||(e.t&&(e.t!==b.t||e.ap!==b.ap)))t.mv=1;
      if(e.ti!==undefined||e.d!==undefined)t.ed=1}
    put(t)}));
  cu.forEach(c=>{if(!hid[c.id])put(Object.assign({k:'now',cu:1,home:c.date},c))});
  ORDER.forEach(d=>{const L=P[d].tasks;
    L.forEach((t,i)=>{t._i=i});
    if(L.every(t=>t.ap&&t.e))L.sort((a,b)=>startMin(a)-startMin(b)||a._i-b._i);
    L.forEach((t,i)=>{t.id=t.id;t.date=d;
      t.h=(t.t&&t.e&&t.ap)?(endMin(t)-startMin(t))/60:0;t.clash=0;delete t._i});
    const T=L.filter(t=>t.ap&&t.e&&t.k!=='rest');
    for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++)if(startMin(T[j])<endMin(T[i])&&startMin(T[i])<endMin(T[j])){T[i].clash=1;T[j].clash=1}
  });
  const ALL=ORDER.flatMap(d=>P[d].tasks);
  return {PLAN:P,ALL,CHECKABLE:ALL.filter(t=>!t.fx&&t.k!=='rest')};
}

/* ---------- streak + daily completion ----------
   A day "counts" when at least 60% of its tickable tasks are done. */
const STREAK_PCT=0.6;
function dayStat(P,iso,done){const L=P[iso].tasks.filter(t=>!t.fx&&t.k!=='rest');const a=L.filter(t=>done[t.id]).length;
  return {iso,n:L.length,a,p:L.length?a/L.length:0,ok:L.length>0&&a/L.length>=STREAK_PCT}}
function streakInfo(P,done,today){
  const last=today<START?START:today>END?END:today;let cur=0,best=0,run=0;
  for(let d=START;d<=last;d=isoAdd(d,1)){const s=dayStat(P,d,done);
    if(s.ok){run++;if(run>best)best=run}else if(d!==last){run=0}else{/* today not finished yet: keep the run alive */}}
  // current streak: walk back from today (today may still be in progress)
  let d=last;if(!dayStat(P,d,done).ok)d=isoAdd(d,-1);
  while(d>=START&&dayStat(P,d,done).ok){cur++;d=isoAdd(d,-1)}
  return {cur,best:Math.max(best,cur),todayOk:dayStat(P,last,done).ok}
}

const LS='balance-plan-v1';
const DEF_SET={lead:10,cls:false,rest:false,am:true,pm:true,haptic:true,exam:'',fm:25,sb:5};
function normState(o){o=o&&typeof o==='object'?o:{};
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{},arr=x=>Array.isArray(x)?x:[];
  return {done:obj(o.done),edits:obj(o.edits),hidden:obj(o.hidden),custom:arr(o.custom),notes:obj(o.notes),scores:arr(o.scores),qs:arr(o.qs),focus:obj(o.focus),
    settings:Object.assign({},DEF_SET,obj(o.settings)),ts:+o.ts||0}}
let state=normState();
try{state=normState(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){}
applyPlan(state);
/* first time two copies meet (this device + another device / backup): keep everything from both */
function mergeStates(a,b){a=normState(a);b=normState(b);const n=a.ts>=b.ts?a:b,o=n===a?b:a;
  const byId=(x,y)=>{const m=new Map();[...y,...x].forEach(r=>r&&r.id&&m.set(r.id,r));return [...m.values()]};
  const fo={};[a.focus,b.focus].forEach(f=>Object.keys(f).forEach(d=>{fo[d]=fo[d]||{};Object.keys(f[d]).forEach(k=>{fo[d][k]=Math.max(fo[d][k]||0,f[d][k]||0)})}));
  return {done:Object.assign({},o.done,n.done),edits:Object.assign({},o.edits,n.edits),hidden:Object.assign({},o.hidden,n.hidden),custom:byId(n.custom,o.custom),
    notes:Object.assign({},o.notes,n.notes),scores:byId(n.scores,o.scores),qs:byId(n.qs,o.qs),focus:fo,settings:Object.assign({},o.settings,n.settings),ts:Math.max(a.ts,b.ts)}}

const clampDay=d=>d<START?START:d>END?END:d;
ui.sel=clampDay(TODAY);

const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}};
/* every change goes through here: stamp it, rebuild the plan if days/times moved, save, sync, tell the alert server */
function changed(plan){state.ts=Date.now();if(plan)applyPlan(state);saveLocal();queueSave();if(typeof onDoneChange==='function')onDoneChange()}
const saveUi=()=>{try{localStorage.setItem(LS+'-ui',JSON.stringify({tab:ui.tab,collapsed:ui.collapsed,skin:ui.skin}))}catch(e){}};
function nowMins(){try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const h=+p.find(x=>x.type==='hour').value%24,m=+p.find(x=>x.type==='minute').value;return h*60+m}catch(e){const d=new Date();return d.getHours()*60+d.getMinutes()}}

/* ---------- sync ---------- */
let dbRef=null,saving=false,dirty=false,timer=null;
function setSync(ok){const el=document.getElementById('sync');el.className='sync fade'+(ok?' ok':'');
  el.querySelector('span').textContent=ok?'ඔක්කොම device වල සුරැකෙනවා':'මේ device එකේ සුරැකෙනවා';}
function queueSave(){dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){if(!dbRef||saving)return;saving=true;dirty=false;
  try{await dbRef.set(Object.assign({},state,{updated:Date.now()}));setSync(true)}
  catch(e){if(e&&e.code==='unavailable'){setTimeout(()=>{dirty=true;flush()},1500+Math.random()*1000)}else setSync(false)}
  saving=false;if(dirty)flush();}
async function initDb(){try{
  if(!window.claude||!window.claude.use)return;
  const db=await window.claude.use('db');if(!db)return;
  dbRef=db.doc('progress/main');let first=true;
  dbRef.onSnapshot(s=>{
    if(s.metadata&&s.metadata.hasPendingWrites)return;
    const raw=s.exists&&s.data();
    if(first){first=false;setSync(true);
      if(!raw){if(state.ts||Object.keys(state.done).length)queueSave();return}
      const m=mergeStates(state,raw);const grew=JSON.stringify(m)!==JSON.stringify(normState(raw));
      state=m;applyPlan(state);saveLocal();render(true);if(grew)queueSave();return}
    if(!dirty&&!saving){const rem=normState(raw);if(rem.ts>state.ts){state=rem;applyPlan(state);saveLocal();render(true)}}
  },()=>setSync(false));
}catch(e){}}

/* ---------- metrics ---------- */
const MCQ_TOTAL=27*7+72*5;
function metric(key){
  const [kind,arg]=key.split(':');let list;
  if(kind==='day')list=PLAN[arg].tasks.filter(t=>!t.fx&&t.k!=='rest');
  else if(kind==='all')list=CHECKABLE;
  else if(kind==='bl')list=ALL.filter(t=>t.bl&&!t.fx);
  else if(kind==='subj')list=ALL.filter(t=>t.s===arg&&t.bl);
  else if(kind==='mcqc'||kind==='mcqd'){const f=kind==='mcqc'?'c':'d',tot=kind==='mcqc'?27:72;let a=0;ALL.forEach(t=>{if(t.mc&&t.mc[f]&&state.done[t.id])a+=t.mc[f]});return {a,b:tot,p:Math.round(a/tot*100)}}
  else if(kind==='mcqleft'){let l=MCQ_TOTAL;ALL.forEach(t=>{if(t.mc&&state.done[t.id])l-=(t.mc.c||0)*7+(t.mc.d||0)*5});return {a:l,b:MCQ_TOTAL,p:Math.round((MCQ_TOTAL-l)/MCQ_TOTAL*100)}}
  else if(kind==='focus'){const a=focusDay(todayISO());return {a,b:120,p:Math.min(100,Math.round(a/120*100))}}
  else if(kind==='time'){const a=diff(START,clampDay(TODAY)),b=diff(START,END);return {a:Math.max(0,diff(TODAY,END)),b,p:Math.round(a/b*100)}}
  const a=list.filter(t=>state.done[t.id]).length;return {a,b:list.length,p:list.length?Math.round(a/list.length*100):0};
}
function ringSVG(key,size,c){const r=size==='big'?44:15.5,vb=size==='big'?104:38,C=2*Math.PI*r,sw=size==='big'?9:4;
  return `<div class="ring ${size}" data-ring="${key}" style="${c?'--rc:'+c:''}"><svg viewBox="0 0 ${vb} ${vb}"><circle class="rb" cx="${vb/2}" cy="${vb/2}" r="${r}" stroke-width="${sw}"/>
  <circle class="rf" cx="${vb/2}" cy="${vb/2}" r="${r}" stroke-width="${sw}" stroke="${c||'var(--ok)'}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-c="${C.toFixed(2)}"/></svg><span class="rv">0%</span></div>`}
function refresh(){
  document.querySelectorAll('[data-ring]').forEach(el=>{const m=metric(el.dataset.ring),f=el.querySelector('.rf');const C=+f.dataset.c;
    f.style.strokeDashoffset=(C*(1-m.p/100)).toFixed(2);el.querySelector('.rv').textContent=m.p+'%'});
  document.querySelectorAll('[data-bar]').forEach(el=>{el.style.width=metric(el.dataset.bar).p+'%'});
  document.querySelectorAll('[data-frac]').forEach(el=>{const m=metric(el.dataset.frac);el.textContent=m.a+'/'+m.b});
  document.querySelectorAll('[data-pct]').forEach(el=>{el.textContent=metric(el.dataset.pct).p+'%'});
  document.querySelectorAll('[data-num]').forEach(el=>{const v=metric(el.dataset.num).a;countTo(el,v)});
  document.querySelectorAll('[data-h]').forEach(el=>{el.style.height=el.dataset.h+'%'});
  document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%'});
  document.querySelectorAll('[data-cnt]').forEach(el=>countTo(el,+el.dataset.cnt));
}
function countTo(el,v){const from=+(el.dataset.v||0);el.dataset.v=v;if(from===v){el.textContent=v;return}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=v;return}
  const t0=performance.now(),d=900;const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(v-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

function toggle(id,btn){
  const on=!state.done[id];if(on)state.done[id]=1;else delete state.done[id];changed(false);vib(on?[12,40,22]:8);
  document.querySelectorAll('[data-tid="'+id+'"]').forEach(el=>{el.classList.toggle('done',on);const b=el.querySelector('.chk');if(b)b.setAttribute('aria-pressed',on)});
  if(on&&btn){const host=btn.closest('[data-tid]');const bs=document.createElement('span');bs.innerHTML=BURST;const node=bs.firstChild;btn.appendChild(node);
    if(host){host.classList.remove('pop');void host.offsetWidth;host.classList.add('pop')}setTimeout(()=>{node.remove();host&&host.classList.remove('pop')},760)}
  refresh();
  if(on&&ui.tab==='today')streakPulse();
}

function stripHTML(iso,cls){
  const [,key]=dayKey(iso),S=SUBJ[key];const ws=weekStart(iso);let strip='',idx=0;
  for(let i=0;i<7;i++){const d=isoAdd(ws,i),ok=PLAN[d];if(d===iso)idx=i;const k=ok?dayKey(d)[1]:'rev';
    strip+=`<button class="sd ${d===TODAY?'is-today':''}" data-day="${d}" ${ok?'':'disabled'} aria-current="${d===iso}" style="--dc:${SUBJ[k].c}">
      <small>${DSH[dow(d)]}</small><b>${+d.slice(8)}</b><span class="dot"></span><span class="pr"><i ${ok?`data-bar="day:${d}"`:''} style="width:0"></i></span></button>`}
  return `<div class="strip ${cls||'stag'}" style="--i:0;--n:${idx};--c:${S.c};--c2:${S.c2}"><span class="ind"></span>${strip}</div>`;
}

function dayBodyHTML(iso){

function render(keepAnim,dir){

/* FLIP: anything that moves or appears after a change glides/pops instead of jumping */
const FLIPSEL='#view [data-tid],#view [data-qid],#view .wday,#view .bcard,#view .tcard,#view .qcard,#view .dl,#view .rest';
const flipKey=el=>(el.dataset.tid||el.dataset.qid||'')+'|'+el.className.split(' ')[0]+'|'+(el.dataset.open||'');
function snapRects(){const m=new Map();document.querySelectorAll(FLIPSEL).forEach(el=>{const r=el.getBoundingClientRect();const k=flipKey(el);if(!m.has(k))m.set(k,{x:r.left,y:r.top})});return m}
function playFlip(before){if(reduced()||!before.size)return;const seen=new Set();
  document.querySelectorAll(FLIPSEL).forEach(el=>{const k=flipKey(el);if(seen.has(k))return;seen.add(k);const r=el.getBoundingClientRect(),o=before.get(k);if(el.animate===undefined)return;
    if(o){const dx=o.x-r.left,dy=o.y-r.top;if(Math.abs(dx)>2||Math.abs(dy)>2)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:520,easing:'cubic-bezier(.22,1,.36,1)'})}
    else if(r.top<innerHeight&&r.bottom>0)el.animate([{opacity:0,transform:'translateY(14px) scale(.96)'},{opacity:1,transform:'none'}],{duration:480,easing:'cubic-bezier(.175,.885,.32,1.275)'})})}
const tabIdx=k=>TABS.findIndex(t=>t[0]===k);
function go(tab){if(tab===ui.tab)return;const dir=Math.sign(tabIdx(tab)-tabIdx(ui.tab));ui.tab=tab;saveUi();render(false,dir);
  const tt=document.getElementById('ttl');tt.classList.remove('swap');void tt.offsetWidth;tt.classList.add('swap');
  const bi=document.querySelector('.bnav [data-tab="'+tab+'"] .bi');if(bi){bi.classList.remove('bounce');void bi.offsetWidth;bi.classList.add('bounce')}
  window.scrollTo({top:0,behavior:'smooth'})}
function goDay(d){d=clampDay(d);
  if(ui.tab!=='today'){ui.sel=d;ui.tab='today';saveUi();render(false,-1);window.scrollTo({top:0,behavior:'smooth'});
    const bi=document.querySelector('.bnav [data-tab="today"] .bi');if(bi){bi.classList.remove('bounce');void bi.offsetWidth;bi.classList.add('bounce')}return}
  if(d===ui.sel)return;const dir=d>ui.sel?1:-1,same=weekStart(d)===weekStart(ui.sel);ui.sel=d;
  const strip=document.querySelector('.strip');
  if(same&&strip){const S=SUBJ[dayKey(d)[1]];strip.style.setProperty('--n',(dow(d)+6)%7);strip.style.setProperty('--c',S.c);strip.style.setProperty('--c2',S.c2);
    strip.querySelectorAll('.sd').forEach(b=>b.setAttribute('aria-current',b.dataset.day===d))}
  else if(strip){strip.outerHTML=stripHTML(d,dir>0?'in-r':'in-l')}
  const body=document.getElementById('dayBody');body.innerHTML=dayBodyHTML(d);body.classList.remove('in-r','in-l');void body.offsetWidth;body.classList.add(dir>0?'in-r':'in-l');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{refresh();setupReveal()}));}
function goWeek(n){const ws=isoAdd(ui.wk||weekStart(clampDay(TODAY)),n);if(ws<weekStart(START)||ws>weekStart(END))return;ui.wk=ws;render(false,Math.sign(n))}

document.addEventListener('click',e=>{
  const ac=e.target.closest('[data-act]');if(ac&&!ac.disabled){const f=ACT[ac.dataset.act];if(f){f(ac,e);return}}

/* scroll reveal: cards below the fold fade up as they scroll into view */
let io=null;
function setupReveal(){if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.classList.remove('rv-wait');el.classList.add('rv-in');io.unobserve(el)}}),{rootMargin:'0px 0px -60px 0px',threshold:.06});
  const vh=innerHeight;document.querySelectorAll('#view .tk,#view .rest,#view .wday,#view .bcard,#view .card,#view .dl,#view .missed').forEach(el=>{
    el.classList.remove('rv-in');const r=el.getBoundingClientRect();if(r.top>vh-40){el.classList.add('rv-wait');io.observe(el)}});onScroll();}
/* sticky header + bottom fade state */
let sTick=false;
function onScroll(){if(sTick)return;sTick=true;requestAnimationFrame(()=>{sTick=false;const y=scrollY;
  document.querySelector('.top').classList.toggle('scrolled',y>8);
  const end=y+innerHeight>=document.documentElement.scrollHeight-6;const f=document.getElementById('bfade');if(f)f.classList.toggle('atend',end);})}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll,{passive:true});
/* ripple */
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.sd,.nb,.snav button,.dl,.open,.skins button,.collapse');if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='rip';
  sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';el.appendChild(sp);setTimeout(()=>sp.remove(),650)},{passive:true});
/* swipe */
let sx=0,sy=0,st=0,sOk=false;
const viewEl=document.getElementById('view');
viewEl.addEventListener('touchstart',e=>{if(e.touches.length!==1){sOk=false;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();sOk=!e.target.closest('.dls,.frame,.skins,.chart,.quick,input,textarea')},{passive:true});
viewEl.addEventListener('touchend',e=>{if(!sOk)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-st>700)return;
  if(ui.tab==='today')goDay(isoAdd(ui.sel,dx<0?1:-1));else if(ui.tab==='week')goWeek(dx<0?7:-7);},{passive:true});

/* ---------- scheduling helpers ---------- */
function gapIn(date,dur,P){P=P||PLAN;const busy=P[date].tasks.filter(t=>t.ap&&t.e).map(t=>[startMin(t),endMin(t)]).sort((x,y)=>x[0]-y[0]);
  const w=dow(date);let cur=(w===0||w===6)?420:930;const hi=23*60+55;
  if(date===TODAY)cur=Math.max(cur,Math.ceil((nowMins()+10)/15)*15);
  for(const [a,b] of busy){if(b<=cur)continue;if(a-cur>=dur)return {a:cur,b:cur+dur,ok:1};cur=Math.max(cur,b)}
  if(hi-cur>=dur)return {a:cur,b:cur+dur,ok:1};
  const a=Math.min(cur,22*60);return {a,b:a+dur,ok:0}}
function subjOnDay(s,d){const key=dayKey(d)[1];if(key===s)return true;if(key==='mix')return s==='et'||s==='sft';if(key==='dip')return ['dip','hex','asg','rev'].includes(s);return false}
function targetDate(t,mode,from){from=from||t.date;
  if(mode==='next'){const d=isoAdd(from,1);return d<=END?d:null}
  const nextSun=()=>{for(let d=isoAdd(from,1);d<=END;d=isoAdd(d,1))if(dow(d)===0)return d;return null};
  if(mode==='sun')return nextSun();
  for(let d=isoAdd(from,1);d<=END;d=isoAdd(d,1))if(subjOnDay(t.s,d))return d;
  return nextSun()}
function clashWith(id,date,a,b){const P=PLAN[date];if(!P)return null;
  return P.tasks.find(x=>x.id!==id&&x.ap&&x.e&&x.k!=='rest'&&startMin(x)<b&&a<endMin(x))||null}
function putSpan(st,t,date,a,b){ // move task t (in plan state st) to date + [a,b)
  if(t.cu){const c=st.custom.find(x=>x.id===t.id);if(c){c.date=date;setSpan(c,a,b)}}
  else{const e=Object.assign({},st.edits[t.id]);e.date=date;setSpan(e,a,b);st.edits[t.id]=e}}

const FKEY='nima-focus';
let FT={open:false,s:'',tid:'',mode:'focus',dur:0,left:0,run:false,end:0,logged:0,round:0},ftWL=null,ftEl=null,ftTimer=null;
try{const o=JSON.parse(localStorage.getItem(FKEY)||'null');if(o&&typeof o==='object')Object.assign(FT,o,{open:false})}catch(e){}
const fSecs=m=>(m==='focus'?state.settings.fm:m==='short'?state.settings.sb:15)*60;
if(!FT.dur){FT.dur=fSecs('focus');FT.left=FT.dur}
const ftLeft=()=>FT.run?Math.max(0,Math.ceil((FT.end-Date.now())/1000)):FT.left;
function ftSave(){try{localStorage.setItem(FKEY,JSON.stringify({s:FT.s,tid:FT.tid,mode:FT.mode,dur:FT.dur,left:FT.left,run:FT.run,end:FT.end,logged:FT.logged,round:FT.round}))}catch(e){}}
function ftLog(){if(FT.mode!=='focus')return;const m=Math.floor((FT.dur-ftLeft()-FT.logged)/60);if(m<1)return;
  const d=todayISO(),k=FT.s||'rev';state.focus[d]=state.focus[d]||{};state.focus[d][k]=(state.focus[d][k]||0)+m;FT.logged+=m*60;changed(false)}
async function ftWake(on){try{if(on&&navigator.wakeLock&&!ftWL){ftWL=await navigator.wakeLock.request('screen');ftWL.addEventListener('release',()=>{ftWL=null})}
  else if(!on&&ftWL){await ftWL.release();ftWL=null}}catch(e){}}
function ftStart(){if(FT.run)return;if(!FT.left)FT.left=FT.dur;FT.end=Date.now()+FT.left*1000;FT.run=true;ftSave();ftWake(true);ftLoop();vib(20)}
function ftPause(){if(!FT.run)return;FT.left=ftLeft();FT.run=false;ftLog();ftSave();ftWake(false);ftPaint()}
function ftReset(){ftLog();FT.run=false;FT.dur=fSecs(FT.mode);FT.left=FT.dur;FT.logged=0;ftSave();ftWake(false);ftPaint()}
function ftMode(m){ftLog();FT.run=false;FT.mode=m;FT.dur=fSecs(m);FT.left=FT.dur;FT.logged=0;ftSave();ftWake(false);ftPaint(true)}
function ftFinish(){FT.left=0;ftLog();const was=FT.mode;FT.run=false;ftWake(false);
  if(was==='focus'){FT.round++;vib([220,90,220,90,420]);
    const msg=`${state.settings.fm} මිනිත්තු focus කළා · අද ${fmtMin(focusDay(todayISO()))}`;toast('Focus round එක ඉවරයි 🎉',msg,'⏱');ftNotify('Focus round එක ඉවරයි',msg)}
  else{vib([160,80,160]);toast('Break එක ඉවරයි','ආයේ focus කරන්න ලෑස්තිද?','☕');ftNotify('Break එක ඉවරයි','ආයේ focus කරන්න ලෑස්තිද?')}
  FT.mode=was==='focus'?(FT.round%4===0?'long':'short'):'focus';FT.dur=fSecs(FT.mode);FT.left=FT.dur;FT.logged=0;ftSave();ftPaint(true);
  if(ui.tab==='tools')render(true)}
function ftNotify(t,b){try{if(!document.hidden||!('Notification' in window)||Notification.permission!=='granted')return;

  else new Notification(t,{body:b})}catch(e){}}
function ftLoop(){clearInterval(ftTimer);ftTimer=setInterval(()=>{if(FT.run&&ftLeft()<=0)ftFinish();ftPaint();if(!FT.run&&!FT.open){clearInterval(ftTimer);ftTimer=null}},250)}

const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const ftSubj=()=>SUBJ[FT.s]||SUBJ.sft;
